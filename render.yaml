# Render Blueprint : site EcoVroom (https://render.com/docs/blueprint-spec).
# N'affecte pas GitHub Pages ni la branche main.
#
# Région Francfort (Union européenne) : plus simple vis-à-vis de la nLPD et du RGPD.
# Render ne permet pas de changer la région d'un service existant : elle est fixée à la création.
# Offre « starter » (payante) avec un disque persistant : la base SQLite (DATABASE_PATH) est
# conservée entre les redémarrages et les déploiements, et le service ne s'endort plus.
services:
  - type: web
    name: ecovroom
    runtime: node
    region: frankfurt
    plan: starter
    branch: claude/core-fleet-extraction
    autoDeploy: true # chaque push sur la branche redéploie le site de test
    buildCommand: echo "Aucune dépendance à installer"
    startCommand: npm start
    healthCheckPath: /api/config
    # Disque persistant (1 Go suffit largement pour la bêta) monté sur /var/data.
    disk:
      name: ecovroom-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Base SQLite sur le disque persistant.
      - key: DATABASE_PATH
        value: /var/data/ecovroom.db
      - key: NODE_VERSION
        value: 22.13.0
      # Render sert le site en HTTPS : cookie de session réservé à HTTPS.
      - key: COOKIE_SECURE
        value: "1"
      # Render place un proxy devant le serveur : l'adresse du visiteur est la dernière ajoutée
      # dans X-Forwarded-For. Sans ce réglage, tous les visiteurs partageraient la même limite
      # de connexions. Pour vérifier : DEBUG_CLIENT_IP=1 quelques minutes, puis lire les journaux.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Clé openrouteservice, demandée par Render à la création (facultative).
      - key: ORS_API_KEY
        sync: false
      # E-mails « mot de passe oublié » via Resend : expéditeur du domaine vérifié chez Resend.
      # Sans clé, la fonction reste masquée. L'adresse du site (liens) vient de RENDER_EXTERNAL_URL.
      - key: MAIL_FROM
        value: "EcoVroom <noreply@ecovroom.org>"
      - key: RESEND_API_KEY
        sync: false
